spring.application.name=cooppilot

# Real keys live in application-local.properties (git-ignored), or in the ANTHROPIC_API_KEY environment variable.
spring.config.import=optional:file:./application-local.properties

# SQLite database file in the working directory (git-ignored)
spring.datasource.url=jdbc:sqlite:${cooppilot.db-file:cooppilot.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# LLM settings. "mock" runs without a key (canned responses, used by tests and offline demos).
cooppilot.llm.provider=mock
cooppilot.llm.api-key=${ANTHROPIC_API_KEY:}
cooppilot.llm.model=claude-haiku-4-5
cooppilot.llm.max-tokens=2048

server.port=8080
