<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Edit vault entry')}"></head>
<body>
<header th:replace="~{fragments :: nav('vault')}"></header>
<main>
    <h1>Edit vault entry</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <section class="card">
        <form method="post" th:action="@{/vault/{id}(id=${e.id})}">
            <label>Title <input name="title" required th:value="${e.title}" style="width:100%"></label>
            <div class="row">
                <label>Kind <select name="kind"><option th:each="k : ${kinds}" th:value="${k}" th:text="${k}" th:selected="${k == e.kind}"></option></select></label>
                <label>Use <select name="use"><option th:each="u : ${uses}" th:value="${u}" th:text="${u}" th:selected="${u == e.use}"></option></select></label>
                <label>Date <input name="date" th:value="${e.date}"></label>
            </div>
            <label>Tags <input name="tags" th:value="${#strings.setJoin(e.tags, ', ')}" style="width:100%"></label>
            <label>Details <textarea name="body" rows="8" th:text="${e.body}"></textarea></label>
            <div class="row">
                <button>Save</button>
                <a class="btn ghost" href="/vault">Cancel</a>
            </div>
        </form>
        <p class="muted small">Use CONTEXT_ONLY for facts that keep the agent accurate but must never be quoted (e.g. "Not yet experienced").</p>
    </section>
</main>
</body>
</html>
