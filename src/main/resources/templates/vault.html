<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Experience vault')}"></head>
<body>
<header th:replace="~{fragments :: nav('vault')}"></header>
<main>
    <h1>Experience vault</h1>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card" th:if="${warnings != null and !warnings.isEmpty()}">
        <strong>Import warnings</strong>
        <ul><li th:each="w : ${warnings}" th:text="${w}"></li></ul>
    </div>
    <div class="grid">
        <section class="card">
            <h2>Import a LaTeX resume</h2>
            <form method="post" action="/vault/import" enctype="multipart/form-data">
                <label>Resume (.tex, Jake's template) <input type="file" name="file" accept=".tex"></label>
                <label>Save as <input name="name" placeholder="CV_General"></label>
                <button type="submit">Import</button>
            </form>
        </section>
        <section class="card">
            <h2>Add an entry</h2>
            <form method="post" action="/vault/entries">
                <label>Title <input name="title" required></label>
                <div class="row">
                    <label>Kind <select name="kind"><option th:each="k : ${kinds}" th:value="${k}" th:text="${k}"></option></select></label>
                    <label>Use <select name="use"><option th:each="u : ${uses}" th:value="${u}" th:text="${u}"></option></select></label>
                </div>
                <label>Date <input name="date" placeholder="2025-09 to present"></label>
                <label>Tags <input name="tags" placeholder="java, spring boot"></label>
                <label>Details <textarea name="body" rows="3"></textarea></label>
                <button type="submit">Save entry</button>
            </form>
        </section>
    </div>
    <section class="card">
        <div class="row" style="justify-content:space-between">
            <h2>Entries (<span th:text="${entries.size()}">0</span>)</h2>
            <form method="get" action="/vault" class="row">
                <input name="q" th:value="${q}" placeholder="Search title, details or tags">
                <button type="submit" class="ghost">Search</button>
            </form>
        </div>
        <table>
            <tr><th>Kind</th><th>Title</th><th>Use</th><th>Date</th><th>Tags</th><th>Details</th></tr>
            <tr th:each="e : ${entries}">
                <td th:text="${e.kind}"></td>
                <td th:text="${e.title}"></td>
                <td th:text="${e.use}"></td>
                <td th:text="${e.date}"></td>
                <td><span class="chip" th:each="t : ${e.tags}" th:text="${t}"></span></td>
                <td><span class="small" style="white-space:pre-line" th:text="${e.body}"></span></td>
            </tr>
        </table>
    </section>
    <section class="card">
        <h2>Resume library (<span th:text="${resumes.size()}">0</span>)</h2>
        <ul>
            <li th:each="r : ${resumes}"><a th:href="@{/resumes/{id}(id=${r.id})}" th:text="${r.name}"></a>
                · <span th:text="${r.kind}"></span> · <span th:text="${r.blocks.size()}"></span> blocks</li>
        </ul>
    </section>
</main>
</body>
</html>
