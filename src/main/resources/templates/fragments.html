<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · CoopPilot'">CoopPilot</title>
    <style>
        :root { --ink:#1b2232; --muted:#667085; --line:#e6e9ef; --bg:#f4f6fa; --card:#fff; --accent:#2f5bea; --accent-dark:#2347c2;
                --accent-soft:#eef3ff; --ok:#127a3f; --warn:#9a6700; --bad:#b42318;
                --shadow: 0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.04); }
        * { box-sizing: border-box; }
        body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink);
               background: var(--bg); margin: 0; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
        header { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff; padding: .55rem 1.4rem;
                 display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(16,24,40,.12); }
        header a { color: #c3cbdb; font-size: .93rem; padding: .32rem .7rem; border-radius: 7px; transition: background-color .15s, color .15s; }
        header a:hover { color: #fff; background: rgba(255,255,255,.08); text-decoration: none; }
        header a.on { color: #fff; background: rgba(255,255,255,.14); }
        header .brand { color: #fff; font-weight: 700; letter-spacing: .01em; margin-right: .9rem; padding-left: 0; display: inline-flex; align-items: center; gap: .5rem; }
        header .brand::before { content: ""; width: 22px; height: 22px; border-radius: 6px; flex: none;
                 background: linear-gradient(135deg, #6c8cff, var(--accent)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
        header .brand:hover { background: none; }
        main { max-width: 1100px; margin: 1.8rem auto 3rem; padding: 0 1.2rem; }
        h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.01em; margin: .2rem 0 1.1rem; }
        h2 { font-size: 1.08rem; font-weight: 650; margin: 0 0 .75rem; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.25rem;
                margin-bottom: 1rem; box-shadow: var(--shadow); }
        a.card { display: block; transition: border-color .15s, box-shadow .15s, transform .15s; }
        a.card:hover { border-color: #c7d4fb; box-shadow: 0 6px 18px rgba(47,91,234,.10); transform: translateY(-2px); text-decoration: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .grid > .card { margin-bottom: 0; } /* the grid's gap spaces them: no double gap between rows */
        table { width: 100%; border-collapse: collapse; font-size: .93rem; }
        th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
        tbody tr:hover td { background: #fafbfd; }
        input, select, textarea { font: inherit; padding: .45rem .6rem; border: 1px solid #cfd5df; border-radius: 8px; max-width: 100%;
                background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,91,234,.15); }
        textarea { width: 100%; }
        button, .btn { font: inherit; font-weight: 550; background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 8px;
                padding: .45rem .95rem; cursor: pointer; text-decoration: none; display: inline-block;
                transition: background-color .15s, border-color .15s, box-shadow .15s; }
        button:hover, .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); text-decoration: none; }
        button:focus-visible, .btn:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(47,91,234,.3); }
        button.ghost, .btn.ghost { background: #fff; color: var(--accent); border: 1px solid #b9c8f8; }
        button.ghost:hover, .btn.ghost:hover { background: var(--accent-soft); border-color: var(--accent); }
        button:disabled { opacity: .55; cursor: default; }
        label { display: block; margin: .35rem 0; font-size: .92rem; }
        details > summary { cursor: pointer; color: var(--accent); font-weight: 550; }
        .muted { color: var(--muted); } .small { font-size: .85rem; }
        .msg { background: #ecfdf3; color: var(--ok); padding: .6rem .9rem; border-radius: 10px; margin-bottom: 1rem; border: 1px solid #abefc6; }
        .err { background: #fef3f2; color: var(--bad); padding: .6rem .9rem; border-radius: 10px; margin-bottom: 1rem; border: 1px solid #fecdca; }
        .chip { display: inline-block; padding: .12rem .5rem; border-radius: 999px; font-size: .8rem; margin: .1rem .15rem .1rem 0; border: 1px solid var(--line); }
        .chip.ok { background: #ecfdf3; color: var(--ok); border-color: #abefc6; }
        .chip.thin { background: #fffaeb; color: var(--warn); border-color: #fedf89; }
        .chip.known { background: #eff4ff; color: var(--accent); border: 1px dashed #84adff; }
        .chip.miss { background: #f2f4f7; color: var(--muted); }
        .stat { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; } .stat-label { color: var(--muted); font-size: .85rem; }
        pre { white-space: pre-wrap; background: #f5f7fa; border: 1px solid var(--line); border-radius: 10px; padding: .9rem; font-size: .82rem; max-height: 420px; overflow: auto; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
        @media (max-width: 600px) { header { gap: .8rem; } th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
    </style>
</head>
<body>
<header th:fragment="nav(active)">
    <a class="brand" href="/">CoopPilot</a>
    <a href="/vault" th:classappend="${active == 'vault'} ? 'on'">Vault</a>
    <a href="/postings" th:classappend="${active == 'postings'} ? 'on'">Postings</a>
    <a href="/resumes" th:classappend="${active == 'resumes'} ? 'on'">Resumes</a>
    <a href="/tracker" th:classappend="${active == 'tracker'} ? 'on'">Tracker</a>
    <a href="/dashboard" th:classappend="${active == 'dashboard'} ? 'on'">Dashboard</a>
</header>
<div th:fragment="flash">
    <div class="msg" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
