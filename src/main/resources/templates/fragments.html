<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · CoopPilot'">CoopPilot</title>
    <style>
        :root { --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --bg:#f7f8fa; --card:#fff; --accent:#2f5bea; --ok:#127a3f; --warn:#9a6700; --bad:#b42318; }
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); background: var(--bg); margin: 0; }
        header { background: var(--ink); color: #fff; padding: .7rem 1.2rem; display: flex; gap: 1.4rem; align-items: center; flex-wrap: wrap; }
        header a { color: #cfd6e4; text-decoration: none; font-size: .95rem; }
        header a:hover, header a.on { color: #fff; }
        header .brand { color: #fff; font-weight: 700; letter-spacing: .02em; margin-right: .6rem; }
        main { max-width: 1080px; margin: 1.4rem auto; padding: 0 1rem; }
        h1 { font-size: 1.5rem; margin: .2rem 0 1rem; } h2 { font-size: 1.1rem; margin: 0 0 .7rem; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
        table { width: 100%; border-collapse: collapse; font-size: .93rem; }
        th, td { text-align: left; padding: .45rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { color: var(--muted); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .03em; }
        input, select, textarea { font: inherit; padding: .4rem .5rem; border: 1px solid #cdd3dd; border-radius: 6px; max-width: 100%; }
        textarea { width: 100%; }
        button, .btn { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: .42rem .85rem; cursor: pointer; text-decoration: none; display: inline-block; }
        button.ghost, .btn.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        label { display: block; margin: .35rem 0; font-size: .92rem; }
        .muted { color: var(--muted); } .small { font-size: .85rem; }
        .msg { background: #ecfdf3; color: var(--ok); padding: .55rem .8rem; border-radius: 8px; margin-bottom: 1rem; }
        .err { background: #fef3f2; color: var(--bad); padding: .55rem .8rem; border-radius: 8px; margin-bottom: 1rem; }
        .chip { display: inline-block; padding: .12rem .5rem; border-radius: 999px; font-size: .8rem; margin: .1rem .15rem .1rem 0; border: 1px solid var(--line); }
        .chip.ok { background: #ecfdf3; color: var(--ok); border-color: #abefc6; }
        .chip.thin { background: #fffaeb; color: var(--warn); border-color: #fedf89; }
        .chip.known { background: #eff4ff; color: var(--accent); border: 1px dashed #84adff; }
        .chip.miss { background: #f2f4f7; color: var(--muted); }
        .stat { font-size: 1.8rem; font-weight: 700; } .stat-label { color: var(--muted); font-size: .85rem; }
        pre { white-space: pre-wrap; background: #f2f4f7; border-radius: 8px; padding: .8rem; font-size: .82rem; max-height: 420px; overflow: auto; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
        @media (max-width: 600px) { header { gap: .8rem; } th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
    </style>
</head>
<body>
<header th:fragment="nav(active)">
    <a class="brand" href="/">CoopPilot</a>
    <a href="/vault" th:classappend="${active == 'vault'} ? 'on'">Vault</a>
    <a href="/postings" th:classappend="${active == 'postings'} ? 'on'">Postings</a>
    <a href="/resumes" th:classappend="${active == 'resumes'} ? 'on'">Resumes</a>
    <a href="/tracker" th:classappend="${active == 'tracker'} ? 'on'">Tracker</a>
    <a href="/dashboard" th:classappend="${active == 'dashboard'} ? 'on'">Dashboard</a>
</header>
<div th:fragment="flash">
    <div class="msg" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
